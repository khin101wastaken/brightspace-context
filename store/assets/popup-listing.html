<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Brightspace Context · Chrome popup</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #242429; background: #eeeef2; }
    * { box-sizing: border-box; }
    body { width: 1280px; height: 800px; margin: 0; overflow: hidden; }
    main { display: grid; grid-template-columns: 440px 1fr; gap: 74px; align-items: center; width: 100%; height: 100%; padding: 24px 64px; }
    .brand { color: #6543a3; font-size: 17px; font-weight: 600; margin: 0 0 32px; }
    h1 { font-size: 44px; line-height: 1.15; letter-spacing: -1.4px; font-weight: 650; margin: 0 0 24px; }
    .description { font-size: 20px; line-height: 1.6; color: #60616b; margin: 0; max-width: 400px; }
    .caption { font-size: 14px; line-height: 1.5; color: #686873; margin: 36px 0 0; }
    img { display: block; height: 752px; width: auto; max-width: 100%; object-fit: contain; }
  </style>
</head>
<body>
  <main>
    <section aria-label="Connect your browser">
      <p class="brand">Brightspace Context</p>
      <h1>Course context,<br>on request.</h1>
      <p class="description">Pair your browser with the local companion to retrieve course files through your desktop AI client.</p>
      <p class="caption">Actual Chrome popup · connected state<br>NYU Brightspace access required for course features.</p>
    </section>
    <img src="popup-original.png" alt="Actual Brightspace Context Chrome popup showing Browser connected, Check connection, Pause, Browse resources and setup links" width="770" height="1112">
  </main>
</body>
</html>
